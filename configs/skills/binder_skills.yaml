schema_version: 1
description: >
  Default binder-harness skill registry index. Each concrete skill lives in its
  own YAML file so inputs, outputs, trigger rules and execution guidance can be
  reviewed independently. Skills provide structured guidance only; deterministic
  scoring, rollback, template gates, length bounds and config validation remain
  the source of truth.

