[project]
name = "binderloop"
version = "0.1.0"
description = "A closed-loop active-learning harness for computational protein binder design"
requires-python = ">=3.9"
dependencies = ["pyyaml>=6.0", "pydantic>=2.0", "pandas>=2.0", "numpy>=1.24", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["binderloop*"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["scripts"]
addopts = "--strict-markers"
